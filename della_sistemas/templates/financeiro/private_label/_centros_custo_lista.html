<div class="ds-table-wrapper">
  <table class="ds-table">
    <thead><tr><th>Nome</th><th>Status</th><th></th></tr></thead>
    <tbody>
      {% for centro in centros_custo %}
      <tr>
        <td>{{ centro.nome }}</td>
        <td>{% if centro.ativo %}<span class="pl-badge pl-badge--quitado">Ativo</span>{% else %}<span class="pl-badge pl-badge--cancelado">Inativo</span>{% endif %}</td>
        <td><button type="button" class="ds-btn ds-btn--outline ds-btn--sm" hx-get="{% url 'financeiro:pl_htmx_centro_custo_form_editar' centro.pk %}" hx-target="#modal-container">Editar</button></td>
      </tr>
      {% empty %}
      <tr><td colspan="3" class="text-muted">Nenhum centro de custo cadastrado ainda.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
