<div class="ds-modal-fundo">
  <div class="ds-modal">
    <div class="ds-modal-titulo">
      <span>Baixar {{ quantidade }} parcela{{ quantidade|pluralize }} selecionada{{ quantidade|pluralize }}</span>
      <button type="button" class="ds-modal-fechar" onclick="document.getElementById('modal-container').innerHTML=''">&times;</button>
    </div>
    <p class="text-muted" style="font-size:.82rem;margin-bottom:.75rem;">
      Baixa total (pelo saldo restante de cada parcela), sem juros/multa/desconto — para baixas com ajuste, use "Baixar" individualmente.
    </p>
    <form hx-post="{% url 'financeiro:pl_htmx_baixa_lote' %}" hx-target="#modal-container" hx-swap="innerHTML">
      {% csrf_token %}
      {% for pid in ids_lista %}<input type="hidden" name="parcela_ids" value="{{ pid }}">{% endfor %}
      <div class="pl-form-grid">
        <div class="pl-form-campo">
          <label>Data</label>
          <input class="ds-input" type="date" name="data" value="{% now 'Y-m-d' %}" required>
        </div>
        <div class="pl-form-campo">
          <label>Conta</label>
          <select class="ds-select" name="conta" required>
            <option value="">Selecione</option>
            {% for conta in contas %}<option value="{{ conta.pk }}">{{ conta.nome }}</option>{% endfor %}
          </select>
        </div>
        <div class="pl-form-campo pl-form-campo--full">
          <label>Forma de pagamento</label>
          <select class="ds-select" name="forma_pagamento">
            <option value="">—</option>
            {% for forma in formas_pagamento %}<option value="{{ forma.pk }}">{{ forma.nome }}</option>{% endfor %}
          </select>
        </div>
      </div>
      <div class="pl-form-acoes">
        <button type="button" class="ds-btn ds-btn--outline" onclick="document.getElementById('modal-container').innerHTML=''">Cancelar</button>
        <button type="submit" class="ds-btn ds-btn--dourado">Confirmar baixa em lote</button>
      </div>
    </form>
  </div>
</div>
