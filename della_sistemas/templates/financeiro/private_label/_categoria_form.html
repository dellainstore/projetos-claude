<div class="ds-modal-fundo" onclick="if(event.target===this) this.remove()">
  <div class="ds-modal">
    <div class="ds-modal-titulo">
      <span>{% if categoria %}Editar categoria{% else %}Nova categoria{% endif %}</span>
      <button type="button" class="ds-modal-fechar" onclick="document.getElementById('modal-container').innerHTML=''">&times;</button>
    </div>
    {% if erro %}<div class="ds-modal-erro">{{ erro }}</div>{% endif %}
    <form hx-post="{% url 'financeiro:pl_htmx_categoria_salvar' %}" hx-target="#modal-container" hx-swap="innerHTML">
      {% csrf_token %}
      {% if categoria %}<input type="hidden" name="pk" value="{{ categoria.pk }}">{% endif %}
      <div class="pl-form-grid">
        <div class="pl-form-campo pl-form-campo--full">
          <label>Nome</label>
          <input class="ds-input" type="text" name="nome" required value="{{ categoria.nome|default:'' }}" autofocus>
        </div>
        <div class="pl-form-campo">
          <label>Natureza (define o DRE)</label>
          <select class="ds-select" name="natureza" required>
            <option value="">Selecione</option>
            {% for valor, label in naturezas %}
            <option value="{{ valor }}" {% if categoria.natureza == valor %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="pl-form-campo">
          <label>Categoria pai (opcional)</label>
          <select class="ds-select" name="categoria_pai">
            <option value="">— nenhuma (categoria raiz) —</option>
            {% for pai in categorias_pai %}
            {% if not categoria or pai.pk != categoria.pk %}
            <option value="{{ pai.pk }}" {% if categoria.categoria_pai_id == pai.pk %}selected{% endif %}>{{ pai.nome }}</option>
            {% endif %}
            {% endfor %}
          </select>
        </div>
      </div>
      <details class="pl-mais-opcoes">
        <summary>Mais opções</summary>
        <div class="pl-form-grid pl-form-grid--3">
          <div class="pl-form-campo">
            <label>Ícone (emoji)</label>
            <input class="ds-input" type="text" name="icone" maxlength="10" value="{{ categoria.icone|default:'' }}">
          </div>
          <div class="pl-form-campo">
            <label>Cor</label>
            <input class="ds-input" type="color" name="cor" value="{{ categoria.cor|default:'#c9a96e' }}" style="height:2.4rem;">
          </div>
          <div class="pl-form-campo">
            <label>Ordem</label>
            <input class="ds-input" type="number" name="ordem" value="{{ categoria.ordem|default:0 }}">
          </div>
          <div class="pl-form-campo">
            <label class="pl-form-check"><input type="checkbox" name="ativa" {% if categoria.ativa|default:True %}checked{% endif %}> Ativa</label>
          </div>
        </div>
      </details>
      <div class="pl-form-acoes">
        <button type="button" class="ds-btn ds-btn--outline" onclick="document.getElementById('modal-container').innerHTML=''">Cancelar</button>
        <button type="submit" class="ds-btn ds-btn--dourado">Salvar</button>
      </div>
    </form>
  </div>
</div>
