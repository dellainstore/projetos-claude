<div class="ds-modal-fundo" onclick="if(event.target===this) this.remove()">
  <div class="ds-modal">
    <div class="ds-modal-titulo">
      <span>Nova transferência entre contas</span>
      <button type="button" class="ds-modal-fechar" onclick="document.getElementById('modal-container').innerHTML=''">&times;</button>
    </div>
    {% if erro %}<div class="ds-modal-erro">{{ erro }}</div>{% endif %}
    <form hx-post="{% url 'financeiro:pl_htmx_transferencia_salvar' %}" hx-target="#modal-container" hx-swap="innerHTML">
      {% csrf_token %}
      <div class="pl-form-grid">
        <div class="pl-form-campo">
          <label>Conta de origem</label>
          <select class="ds-select" name="conta_origem" required>
            <option value="">Selecione</option>
            {% for conta in contas %}<option value="{{ conta.pk }}">{{ conta.nome }}</option>{% endfor %}
          </select>
        </div>
        <div class="pl-form-campo">
          <label>Conta de destino</label>
          <select class="ds-select" name="conta_destino" required>
            <option value="">Selecione</option>
            {% for conta in contas %}<option value="{{ conta.pk }}">{{ conta.nome }}</option>{% endfor %}
          </select>
        </div>
        <div class="pl-form-campo">
          <label>Valor (R$)</label>
          <input class="ds-input" type="number" step="0.01" min="0.01" name="valor" required>
        </div>
        <div class="pl-form-campo">
          <label>Data</label>
          <input class="ds-input" type="date" name="data" value="{% now 'Y-m-d' %}" required>
        </div>
        <div class="pl-form-campo pl-form-campo--full">
          <label>Observação</label>
          <input class="ds-input" type="text" name="observacao">
        </div>
      </div>
      <p class="text-muted" style="font-size:.78rem;margin-top:.5rem;">Transferências não entram no DRE nem em despesas/receitas por categoria.</p>
      <div class="pl-form-acoes">
        <button type="button" class="ds-btn ds-btn--outline" onclick="document.getElementById('modal-container').innerHTML=''">Cancelar</button>
        <button type="submit" class="ds-btn ds-btn--dourado">Transferir</button>
      </div>
    </form>
  </div>
</div>
