{% load core_extras %}
<div class="ds-modal-fundo">
  <div class="ds-modal">
    <div class="ds-modal-titulo">
      <span>Pagar fatura — {{ fatura.cartao.nome }} ({{ fatura.competencia_mes }}/{{ fatura.competencia_ano }})</span>
      <button type="button" class="ds-modal-fechar" onclick="document.getElementById('modal-container').innerHTML=''">&times;</button>
    </div>
    {% if erro %}<div class="ds-modal-erro">{{ erro }}</div>{% endif %}
    <p class="text-muted" style="font-size:.85rem;margin:-.3rem 0 .9rem;">Saldo em aberto: <strong>{{ fatura.saldo_restante|brl }}</strong> — vencimento {{ fatura.data_vencimento|date:"d/m/Y" }}</p>
    <form hx-post="{% url 'financeiro:pl_htmx_fatura_pagar_salvar' fatura.pk %}" hx-target="#modal-container" hx-swap="innerHTML">
      {% csrf_token %}
      <div class="pl-form-grid">
        <div class="pl-form-campo">
          <label>Valor a pagar (R$)</label>
          <input class="ds-input" type="number" step="0.01" min="0.01" max="{{ fatura.saldo_restante }}" name="valor" required autofocus value="{{ fatura.saldo_restante|stringformat:'s' }}">
        </div>
        <div class="pl-form-campo">
          <label>Data do pagamento</label>
          <input class="ds-input" type="date" name="data" required value="{% now 'Y-m-d' %}">
        </div>
        <div class="pl-form-campo pl-form-campo--full">
          <label>Conta de pagamento</label>
          <select class="ds-select" name="conta" required>
            <option value="">Selecione</option>
            {% for conta in contas %}
            <option value="{{ conta.pk }}" {% if fatura.cartao.conta_pagamento_padrao_id == conta.pk %}selected{% endif %}>{{ conta.nome }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="pl-form-campo pl-form-campo--full">
          <label>Observação</label>
          <input class="ds-input" type="text" name="observacao">
        </div>
      </div>
      <div class="pl-form-acoes">
        <button type="button" class="ds-btn ds-btn--outline" onclick="document.getElementById('modal-container').innerHTML=''">Cancelar</button>
        <button type="submit" class="ds-btn ds-btn--dourado">Pagar</button>
      </div>
    </form>
  </div>
</div>
