{% comment %}
Estilos compartilhados por todas as telas do Private Label. Incluído via
include dentro do bloco css_extra de cada página — segue o padrão do
projeto de CSS local por página (ex.: templates/tarefas/).
{% endcomment %}
<style>
  /* O .ds-table-wrapper padrão do sistema só libera rolagem horizontal
     abaixo de 768px (overflow:hidden no resto) — nas telas do Private
     Label as tabelas são mais largas que isso (min-width:1000px), então
     sem essa rolagem em telas de desktop mais estreitas a coluna de ações
     ficava cortada e SEM jeito de rolar até ela. Libera sempre, só aqui. */
  .ds-table-wrapper { overflow-x: auto; }

  /* Navegação interna "abas" do submenu Private Label */
  .pl-abas { margin-bottom: 1.25rem; border-bottom: 1px solid var(--cinza-medio); }
  .pl-abas-desktop { display: flex; gap: .25rem; }
  .pl-aba {
    padding: .6rem 1rem; font-size: .86rem; font-weight: 600; color: var(--cinza-texto);
    text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .pl-aba:hover { color: var(--preto); }
  .pl-aba.ativa { color: var(--dourado); border-bottom-color: var(--dourado); }
  .pl-abas-mobile { display: none; width: 100%; margin-bottom: .75rem; }
  @media (max-width: 768px) {
    .pl-abas-desktop { display: none; }
    .pl-abas-mobile { display: block; }
    .pl-abas { border-bottom: none; }
  }

  /* Sub-abas de Configurações (contas/categorias/...) */
  .pl-subabas { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .pl-subaba {
    padding: .4rem .8rem; font-size: .8rem; font-weight: 600; border-radius: 999px;
    text-decoration: none; color: var(--cinza-texto); background: var(--cinza-claro);
  }
  .pl-subaba.ativa { color: var(--branco); background: var(--dourado); }

  /* Modal (mesmo padrão de templates/tarefas/) */
  #modal-container:empty { display: none; }
  .ds-modal-fundo {
    position: fixed; inset: 0; background: rgba(10,10,10,.5); display: flex;
    align-items: center; justify-content: center; z-index: 1000; padding: 1rem;
  }
  .ds-modal {
    background: var(--branco); border-radius: 12px; padding: 1.5rem; width: 100%;
    max-width: 560px; max-height: 90vh; overflow-y: auto;
  }
  .ds-modal--largo { max-width: 720px; }
  .ds-modal-titulo {
    font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--preto);
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;
  }
  .ds-modal-fechar { border: none; background: none; font-size: 1.3rem; cursor: pointer; color: var(--cinza-texto); line-height: 1; }
  .ds-modal-erro {
    background: rgba(217,79,79,.1); color: var(--vermelho); padding: .55rem .75rem;
    border-radius: 6px; font-size: .82rem; margin-bottom: .9rem;
  }

  /* Form */
  .pl-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .pl-form-grid--3 { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 560px) { .pl-form-grid, .pl-form-grid--3 { grid-template-columns: 1fr; } }
  .pl-form-campo { display: flex; flex-direction: column; gap: .25rem; font-size: .82rem; color: var(--cinza-texto); }
  .pl-form-campo--full { grid-column: 1 / -1; }
  .pl-form-check { display: flex; align-items: center; gap: .4rem; font-size: .82rem; font-weight: 400; }
  .pl-mais-opcoes { margin-top: .5rem; }
  .pl-mais-opcoes summary { cursor: pointer; font-size: .82rem; color: var(--dourado); font-weight: 600; margin-bottom: .6rem; }
  .pl-form-acoes { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1.1rem; }

  /* Status badges */
  .pl-badge { display: inline-block; padding: .18rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 700; }
  .pl-badge--previsto  { background: rgba(107,107,107,.12); color: var(--cinza-texto); }
  .pl-badge--pendente  { background: rgba(212,160,23,.15); color: var(--amarelo); }
  .pl-badge--parcial   { background: rgba(212,160,23,.22); color: #8a6a10; }
  .pl-badge--vencido   { background: rgba(217,79,79,.14); color: var(--vermelho); }
  .pl-badge--quitado   { background: rgba(45,158,110,.14); color: var(--verde); }
  .pl-badge--cancelado { background: rgba(107,107,107,.18); color: var(--cinza-texto); text-decoration: line-through; }

  /* Valores: despesa em vermelho, receita em azul (pedido do dono) */
  .pl-valor-despesa { color: var(--vermelho); font-weight: 600; }
  .pl-valor-receita { color: #2563eb; font-weight: 600; }

  /* Botões de ação em ícone (bolinha + símbolo), tooltip nativo via title=
     no hover (desktop). Sem lib nova. Em mobile o hover não existe — o
     símbolo por si só (com bom contraste/tamanho de toque ~30px) precisa
     ser reconhecível sozinho. A tabela rola na horizontal em telas
     pequenas, mas a coluna de ações fica "grudada" na borda direita
     (position: sticky) pra nunca ficar escondida fora da tela. */
  .pl-acoes { display: flex; gap: .3rem; flex-wrap: nowrap; }
  .pl-col-acoes {
    position: sticky; right: 0; background: var(--branco);
    box-shadow: -6px 0 8px -6px rgba(0,0,0,.18);
  }
  .pl-icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; min-width: 30px; border-radius: 50%;
    border: 1px solid var(--cinza-medio); background: var(--branco);
    color: var(--cinza-texto); font-size: .9rem; line-height: 1; cursor: pointer;
    padding: 0; transition: background .15s, color .15s, border-color .15s;
  }
  .pl-icon-btn:hover { background: var(--cinza-claro); color: var(--preto); }
  .pl-icon-btn--dourado { border-color: var(--dourado); color: var(--dourado); }
  .pl-icon-btn--dourado:hover { background: var(--dourado); color: var(--branco); }
  .pl-icon-btn--perigo { border-color: var(--vermelho); color: var(--vermelho); }
  .pl-icon-btn--perigo:hover { background: var(--vermelho); color: var(--branco); }

  /* Filtros */
  .pl-filtros {
    display: flex; gap: .6rem; align-items: flex-end; flex-wrap: wrap;
    background: var(--branco); border: 1px solid var(--cinza-medio); border-radius: 10px;
    padding: .8rem .9rem; margin-bottom: 1.1rem;
  }
  .pl-filtros .pl-form-campo { min-width: 140px; }

  /* Barra de ações em lote */
  .pl-lote-barra {
    display: none; align-items: center; gap: .75rem; background: rgba(201,169,110,.12);
    border: 1px solid var(--dourado); border-radius: 8px; padding: .6rem .9rem; margin-bottom: .8rem;
    font-size: .85rem;
  }
  .pl-lote-barra.visivel { display: flex; }

  .pl-topo {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: .75rem; margin-bottom: 1.1rem;
  }
  .pl-topo-acoes { display: flex; gap: .6rem; flex-wrap: wrap; }
</style>
