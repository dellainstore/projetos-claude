{% comment %}Estilos compartilhados das telas do Motoqueiro (abas + cards).{% endcomment %}
<style>
  .moto-abas { margin-bottom: 1.25rem; border-bottom: 1px solid var(--cinza-medio); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; }
  .moto-abas-lista { display: flex; gap: .25rem; }
  .moto-aba {
    padding: .6rem 1rem; font-size: .86rem; font-weight: 600; color: var(--cinza-texto);
    text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .moto-aba:hover { color: var(--preto); }
  .moto-aba.ativa { color: var(--dourado); border-bottom-color: var(--dourado); }
  /* No mobile as abas continuam sendo ABAS, so que rolando na horizontal.
     Antes viravam um <select>, e como .ds-input tem `appearance: none` o
     campo saia sem a setinha — ficava identico a uma caixa de texto, entao
     ninguem descobria que dali dava pra chegar no Dashboard. */
  @media (max-width: 768px) {
    .moto-abas { border-bottom: none; flex-direction: column; align-items: stretch; }
    .moto-abas-lista {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-bottom: 1px solid var(--cinza-medio);
      scrollbar-width: none;
    }
    .moto-abas-lista::-webkit-scrollbar { display: none; }
    .moto-aba { padding: .6rem .75rem; white-space: nowrap; flex: 0 0 auto; }
  }

  .moto-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .9rem; margin-bottom: 1.3rem; }
  .moto-card { background: var(--branco); border: 1px solid var(--cinza-borda); border-radius: 10px; padding: 1rem 1.2rem; }
  .moto-card-label { font-size: .78rem; color: var(--cinza-texto); margin-bottom: .3rem; }
  .moto-card-valor { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--preto); }

  .moto-sugestoes-lista {
    position: absolute; z-index: 20; left: 0; right: 0; top: 100%;
    background: var(--branco); border: 1px solid var(--cinza-borda); border-top: none;
    border-radius: 0 0 8px 8px; box-shadow: 0 4px 10px rgba(0,0,0,.08); max-height: 220px; overflow-y: auto;
  }
  .moto-sugestao { padding: .55rem .8rem; font-size: .85rem; cursor: pointer; border-bottom: 1px solid var(--cinza-claro); }
  .moto-sugestao:last-child { border-bottom: none; }
  .moto-sugestao:hover { background: var(--cinza-claro); }

  .moto-cotacao-card {
    border: 1px solid var(--cinza-borda); border-radius: 10px; padding: 1rem 1.2rem;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: .6rem;
  }
  .moto-cotacao-card.mais-barata { border-color: var(--dourado); background: rgba(201,169,110,.06); }

  .moto-ao-vivo {
    display: inline-flex; align-items: center; gap: .18rem;
    background: var(--vermelho); color: #fff; font-size: .55rem; font-weight: 700;
    line-height: 1.1; letter-spacing: .01em; padding: .1rem .35rem; border-radius: 999px;
    text-decoration: none; white-space: nowrap; animation: moto-pulse 1.6s infinite;
  }
  .moto-ao-vivo:hover { opacity: .85; }

  /* Relatório tem muitas colunas (data, rastreio, endereços, status...) —
     em vez de espremer/cortar badge e texto no desktop (padrão do
     .ds-table-wrapper é overflow:hidden, só ganha scroll no mobile), deixa
     rolar horizontalmente sempre e trava badges numa linha só. */
  .moto-secao .ds-table-wrapper { overflow-x: auto; }
  /* width:100% faria as colunas se espremerem até cortar o conteúdo em vez de
     acionar o scroll do wrapper; max-content deixa cada coluna no tamanho real. */
  .moto-secao .ds-table { width: max-content; min-width: 100%; }
  .moto-secao .ds-status { white-space: nowrap; }
  /* .ds-input é width:100% — dentro da célula estreita o select de status
     cortava o rótulo ("Aguar..."). Aqui ele acompanha a maior opção. */
  .moto-secao td select.ds-input { width: auto; min-width: 11rem; }

  /* Cancelar corrida: acao destrutiva e rara — fica discreta embaixo do
     status, so aparece enquanto a Lalamove ainda aceita o cancelamento. */
  .moto-form-cancelar { margin-top: .35rem; }
  .moto-btn-cancelar {
    background: none; border: 1px solid var(--vermelho); color: var(--vermelho);
    font-family: inherit; font-size: .68rem; font-weight: 600; line-height: 1.2;
    padding: .2rem .5rem; border-radius: 999px; cursor: pointer;
    white-space: nowrap; transition: background .2s, color .2s;
  }
  .moto-btn-cancelar:hover { background: var(--vermelho); color: #fff; }

  .moto-btn-prioridade {
    background: none; border: 1px solid var(--dourado); color: var(--dourado);
    font-family: inherit; font-size: .68rem; font-weight: 600; line-height: 1.2;
    padding: .2rem .5rem; border-radius: 999px; cursor: pointer;
    white-space: nowrap; transition: background .2s, color .2s;
  }
  .moto-btn-prioridade:hover { background: var(--dourado); color: #fff; }
  .moto-btn-prioridade:disabled { opacity: .6; cursor: default; }
  .moto-prioridade-atual {
    font-size: .68rem; color: var(--dourado); font-weight: 600; margin-top: .3rem;
    white-space: nowrap;
  }

  .moto-saldo-pill {
    background: var(--cinza-claro); color: var(--preto); font-size: .78rem;
    padding: .35rem .7rem; border-radius: 999px; white-space: nowrap;
  }
  .moto-saldo-pill strong { color: var(--dourado); }
  @keyframes moto-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(217,79,79,.5); }
    50% { box-shadow: 0 0 0 5px rgba(217,79,79,0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .moto-ao-vivo { animation: none; }
  }
</style>
