{% load metas_extras %}
{% comment %}Navegação interna Motoqueiro — rota própria por aba, funciona com F5. No mobile as abas continuam visíveis e rolam na horizontal (o <select> de antes passava despercebido). Saldo Lalamove + botão "Solicitar corrida" ficam sempre ao lado.{% endcomment %}
<div class="moto-abas">
  <div class="moto-abas-lista">
    {% if user.pode_ver_motoqueiro_dashboard %}
    <a href="{% url 'motoqueiro:dashboard' %}" class="moto-aba {% if request.resolver_match.url_name == 'dashboard' %}ativa{% endif %}">Dashboard</a>
    {% endif %}
    {% if user.pode_ver_motoqueiro_relatorio %}
    <a href="{% url 'motoqueiro:relatorio' %}" class="moto-aba {% if request.resolver_match.url_name == 'relatorio' %}ativa{% endif %}">Resumo de Corridas</a>
    {% endif %}
    {% if user.pode_gerir_saldo_motoqueiro %}
    <a href="{% url 'motoqueiro:saldo' %}" class="moto-aba {% if request.resolver_match.url_name == 'saldo' %}ativa{% endif %}">Saldo Lalamove</a>
    {% endif %}
    {% if user.pode_monitorar_motoqueiro %}
    <a href="{% url 'motoqueiro:monitoramento' %}" class="moto-aba {% if request.resolver_match.url_name == 'monitoramento' %}ativa{% endif %}">Monitoramento</a>
    {% endif %}
  </div>
  <div style="display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;">
    {% if saldo_lalamove is not None %}
    <span class="moto-saldo-pill" title="Saldo atual da carteira Lalamove">
      Saldo Lalamove: <strong>{{ saldo_lalamove|brl }}</strong>
    </span>
    {% endif %}
    {% if user.pode_solicitar_motoqueiro %}
    <a href="{% url 'motoqueiro:solicitar' %}" class="ds-btn ds-btn--primario ds-btn--sm">+ Solicitar corrida</a>
    {% endif %}
  </div>
</div>
