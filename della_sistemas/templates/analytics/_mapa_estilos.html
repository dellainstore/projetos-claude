<style>
  /* ── Mapa em blocos + cidades ─────────────────────────────────────────── */
  .an-geo {
    display: grid; gap: 1rem;
    grid-template-columns: 1fr;
  }
  @media (min-width: 900px) {
    .an-geo { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  }

  .an-mapa-wrap {
    background: var(--branco); border: 1px solid var(--cinza-medio);
    border-radius: 10px; padding: 1rem;
  }

  /* Mapa: contorno real dos estados (malha do IBGE), com arrastar e zoom. */
  .an-mapa-card { position: relative; }
  .an-mapa-palco {
    overflow: hidden; position: relative;
    background:
      repeating-linear-gradient(45deg, transparent 0 12px, rgba(0,0,0,.012) 12px 24px),
      var(--cinza-claro);
    cursor: grab;
  }
  .an-mapa-palco.arrastando { cursor: grabbing; }
  .an-mapa-palco svg { width: 100%; height: 100%; display: block; touch-action: none; }
  #an-mapa-g { transition: transform 0.12s ease-out; transform-origin: 0 0; }
  #an-mapa-g.sem-transicao { transition: none; }

  .an-uf-path {
    stroke: var(--branco); stroke-width: 1.4; stroke-linejoin: round;
    cursor: pointer; transition: filter 0.12s;
  }
  .an-uf-path:hover { filter: brightness(0.92); }
  .an-uf-path.destacado { stroke: var(--preto); stroke-width: 2.6; }

  /* Escala de intensidade sobre o dourado da marca. Aplicada como `fill` no
     mapa e como `background` na legenda, por isso as duas propriedades. */
  .an-uf-n0 { fill: #e6e2d8; background: var(--cinza-claro); color: #b9b3a4; }
  .an-uf-n1 { fill: #f2e7cd; background: #f2e7cd; color: #7a6220; }
  .an-uf-n2 { fill: #e3cd95; background: #e3cd95; color: #6a541a; }
  .an-uf-n3 { fill: #cfae5c; background: #cfae5c; color: #3d3010; }
  .an-uf-n4 { fill: #c9a96e; background: var(--dourado); color: var(--branco); }

  .an-mapa-ctrl { float: right; display: flex; gap: 0.25rem; }
  .an-mapa-ctrl button {
    font-family: inherit; font-size: 0.68rem; line-height: 1;
    padding: 0.2rem 0.45rem; cursor: pointer;
    border: 1px solid var(--cinza-medio); border-radius: 4px;
    background: var(--branco); color: var(--cinza-texto);
  }
  .an-mapa-ctrl button:hover { background: var(--cinza-claro); color: var(--preto); }

  .an-mapa-dica {
    position: absolute; left: 0; right: 0; bottom: 0.4rem;
    text-align: center; font-size: 0.64rem; color: var(--cinza-texto);
    pointer-events: none; opacity: 0.75;
  }

  .an-mapa-legenda {
    display: flex; align-items: center; justify-content: center;
    gap: 0.4rem; padding: 0.6rem; flex: 0 0 auto;
    border-top: 1px solid var(--cinza-medio);
    font-size: 0.7rem; color: var(--cinza-texto);
  }
  .an-legenda-escala { display: flex; gap: 2px; }
  .an-legenda-bloco { width: 18px; height: 10px; border-radius: 2px; }

  /* ── Card com tabela rolavel ──────────────────────────────────────────────
     Altura fixa para o card nao crescer conforme o numero de linhas: assim a
     pagina inteira nao muda de tamanho quando entra um estado ou produto novo,
     e a rolagem acontece DENTRO do card, nao na tela. */
  .an-duas-colunas { display: grid; gap: 1rem; grid-template-columns: 1fr; }
  @media (min-width: 900px) { .an-duas-colunas { grid-template-columns: 1fr 1fr; } }

  .an-card-tabela {
    background: var(--branco); border: 1px solid var(--cinza-medio);
    border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column;
    height: 360px;
  }
  .an-card-tabela-topo {
    padding: 0.7rem 0.9rem; border-bottom: 1px solid var(--cinza-medio);
    font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--cinza-texto); background: var(--cinza-claro); flex: 0 0 auto;
  }
  .an-card-tabela-corpo { flex: 1 1 auto; overflow-y: auto; }
  .an-tabela-compacta { min-width: 0; }
  .an-tabela-compacta td { padding: 0.5rem 0.9rem; font-size: 0.82rem; }
  .an-tabela-compacta td.num { font-weight: 600; }
  .an-tabela-compacta tbody tr:hover { background: var(--cinza-claro); }

  /* Lista de cidades */
  .an-cidades { display: flex; flex-direction: column; gap: 0.55rem; }
  .an-cidade-linha { display: grid; grid-template-columns: 1fr auto; gap: 0.3rem 0.6rem; align-items: baseline; }
  .an-cidade-nome { font-size: 0.85rem; color: var(--preto); }
  .an-cidade-uf { font-size: 0.72rem; color: var(--cinza-texto); }
  .an-cidade-total { font-size: 0.85rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .an-cidade-barra { grid-column: 1 / -1; height: 4px; background: var(--cinza-claro); border-radius: 2px; overflow: hidden; }
  .an-cidade-barra span { display: block; height: 100%; background: var(--dourado); border-radius: 2px; }

  /* ── Tabela de origens com retorno ────────────────────────────────────── */
  .an-tabela-wrap { overflow-x: auto; background: var(--branco); border: 1px solid var(--cinza-medio); border-radius: 10px; }
  .an-tabela { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 520px; }
  .an-tabela thead th {
    text-align: left; padding: 0.65rem 0.85rem;
    font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--cinza-texto); background: var(--cinza-claro);
    border-bottom: 1px solid var(--cinza-medio); white-space: nowrap;
  }
  .an-tabela tbody td { padding: 0.6rem 0.85rem; border-bottom: 1px solid var(--cinza-claro); vertical-align: middle; }
  .an-tabela tbody tr:last-child td { border-bottom: none; }
  .an-tabela .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .an-tag-paga {
    display: inline-block; margin-left: 0.4rem; padding: 0.08rem 0.35rem;
    font-size: 0.6rem; letter-spacing: 0.04em; text-transform: uppercase;
    background: #f2e7cd; color: #7a6220; border-radius: 3px; vertical-align: 0.08em;
  }
  .an-conv-forte { color: #2e7d32; font-weight: 600; }

  /* ── Dispositivo ──────────────────────────────────────────────────────── */
  .an-disp { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .an-disp-item {
    flex: 1 1 90px; background: var(--branco); border: 1px solid var(--cinza-medio);
    border-radius: 10px; padding: 0.7rem 0.85rem;
  }
  .an-disp-rotulo { font-size: 0.7rem; color: var(--cinza-texto); margin-bottom: 0.2rem; }
  .an-disp-valor { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .an-disp-pct { font-size: 0.72rem; color: var(--cinza-texto); }
</style>
